# MANIFESTO en GitHub Pages: https://epsilong21.github.io/manifesto-art/
# Compila la exportación estática y publica solo out/ (HTML, JS, CSS, fuentes y
# variantes WebP de las obras), nunca el código fuente ni la reproducción de Dalí.
name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Fuerza MANIFESTO_ELEFANTES_IMAGEN=off, genera out/ y lo verifica
      # (rutas, recursos enlazados y exclusiones); falla si algo no cuadra
      - run: npm run build:pages
        env:
          MANIFESTO_BASE_PATH: /manifesto-art
          NEXT_PUBLIC_SITE_URL: https://epsilong21.github.io/manifesto-art
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
